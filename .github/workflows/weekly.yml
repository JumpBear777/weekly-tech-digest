name: Weekly Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'   # 每周一 08:00 UTC（北京时间 16:00）

# 同一时间只跑一个：手动触发和定时任务撞车时排队，不要抢着 push
concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      # 用 v5：原生跑在 Node 24 上。checkout@v4 被强行切到 Node 24 时，
      # 内置的 git 凭据注入可能失效，表现为私有仓库「Repository not found」
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 先花两秒确认密钥可用，失败信息直接指到根因，不用再翻脚本日志
      - name: Check DeepSeek key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::仓库 secret DEEPSEEK_API_KEY 为空，请到 Settings → Secrets and variables → Actions 配置"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            https://api.deepseek.com/models \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY")
          echo "DeepSeek /models -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::DEEPSEEK_API_KEY 无效或已吊销（HTTP $code），请重新生成密钥并更新 secret"
            exit 1
          fi

      - name: Run Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/generate_report.py

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add Weekly Knowledge

          git diff --staged --quiet || git commit -m "weekly report"

          git push

      - name: Notify failure
        if: failure()
        run: echo "::error::本周周报生成失败，先看上面的日志；最常见原因是 DEEPSEEK_API_KEY 失效"

      # checkout 拿不到凭据时只会说 Repository not found，看不出到底缺什么，这里补一次自检
      - name: Diagnose git access
        if: failure()
        run: |
          echo "repository: ${{ github.repository }}"
          echo "ref:        ${{ github.ref }}"
          echo "event:      ${{ github.event_name }}"
          echo "--- remote ---"
          git remote -v || true
          echo "--- 已注入的 http 配置项（只列名字，不打印内容）---"
          git config --name-only --get-regexp 'http\.' || true
          echo "--- 读权限探测 ---"
          git ls-remote --heads origin 2>&1 | head -5 || true
